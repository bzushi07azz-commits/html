<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuenta regresiva</title>

<style>

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#111827,#1e40af);
color:white;
padding:30px;
}


h1{
text-align:center;
font-size:45px;
}


.container{
max-width:1100px;
margin:auto;
display:grid;
gap:25px;
}


.card{

background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.4);

}


.title{

font-size:25px;
font-weight:bold;
text-align:center;

}


.date{

text-align:center;
opacity:.8;
margin:10px;

}


.timer{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;

}


.box{

background:rgba(255,255,255,.15);

padding:20px;

border-radius:15px;

text-align:center;

}


.number{

font-size:40px;
font-weight:bold;

}


.label{

font-size:14px;
opacity:.8;

}



.finished{

color:#86efac;

}


@media(max-width:700px){

.timer{

grid-template-columns:repeat(2,1fr);

}

h1{

font-size:30px;

}

}


</style>

</head>


<body>


<h1>⏳ Cuenta regresiva</h1>


<div class="container">



<div class="card">

<div class="title">
🎯 Evento principal
</div>

<div class="date">
1 de diciembre de 2026 - 12:30 PM 🇦🇷
</div>

<div class="timer" id="timer1"></div>

</div>




<div class="card">

<div class="title">
🍂 13 de noviembre
</div>

<div class="date">
13 de noviembre de 2026 - 00:00 🇦🇷
</div>

<div class="timer" id="timer2"></div>

</div>




<div class="card">

<div class="title">
🎄 Navidad
</div>

<div class="date">
25 de diciembre de 2026 - 00:00 🇦🇷
</div>

<div class="timer" id="timer3"></div>

</div>




<div class="card">

<div class="title">
🎁 27 de diciembre
</div>

<div class="date">
27 de diciembre de 2026 - 00:00 🇦🇷
</div>

<div class="timer" id="timer4"></div>

</div>




<div class="card">

<div class="title">
🎆 Año nuevo
</div>

<div class="date">
1 de enero de 2027 - 00:00 🇦🇷
</div>

<div class="timer" id="timer5"></div>

</div>



</div>



<script>


const counters=[

{
id:"timer1",
date:"2026-12-01T12:30:00-03:00"
},

{
id:"timer2",
date:"2026-11-13T00:00:00-03:00"
},

{
id:"timer3",
date:"2026-12-25T00:00:00-03:00"
},

{
id:"timer4",
date:"2026-12-27T00:00:00-03:00"
},

{
id:"timer5",
date:"2027-01-01T00:00:00-03:00"
}

];



function createBoxes(id){

document.getElementById(id).innerHTML=`

<div class="box">
<div class="number" id="${id}days">0</div>
<div class="label">Días</div>
</div>

<div class="box">
<div class="number" id="${id}hours">0</div>
<div class="label">Horas</div>
</div>

<div class="box">
<div class="number" id="${id}minutes">0</div>
<div class="label">Minutos</div>
</div>

<div class="box">
<div class="number" id="${id}seconds">0</div>
<div class="label">Segundos</div>
</div>

`;

}



counters.forEach(c=>createBoxes(c.id));



function update(){

const now=new Date().getTime();


counters.forEach(c=>{


const target=new Date(c.date).getTime();

let diff=target-now;


if(diff<0){

document.getElementById(c.id).innerHTML=
"<h2 class='finished'>✅ Finalizado</h2>";

return;

}



let days=Math.floor(diff/(1000*60*60*24));

let hours=Math.floor(
(diff%(1000*60*60*24))/(1000*60*60)
);


let minutes=Math.floor(
(diff%(1000*60*60))/(1000*60)
);


let seconds=Math.floor(
(diff%(1000*60))/1000
);



document.getElementById(c.id+"days").innerHTML=days;

document.getElementById(c.id+"hours").innerHTML=hours;

document.getElementById(c.id+"minutes").innerHTML=minutes;

document.getElementById(c.id+"seconds").innerHTML=seconds;



});


}


update();

setInterval(update,1000);


</script>


</body>
</html>
