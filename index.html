<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Royale</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="stage">
    <div id="topbar">
      <span>👑 <span class="crown" id="cr2">0</span></span>
      <span id="clock">2:00</span>
      <span><span class="crown" id="cr1">0</span> 👑</span>
    </div>

    <canvas id="cv" width="432" height="720"></canvas>

    <div class="row">
      <span id="elixirTxt">5</span>
      <div id="elixir"><div id="elixirFill"></div></div>
    </div>

    <div id="cardbar"></div>
  </div>

  <div id="overlay">
    <h1>MINI ROYALE</h1>
    <p>Toca una carta y luego el campo para desplegarla. Solo puedes colocar tropas en <b>tu mitad</b> (abajo). Los hechizos van a cualquier parte. Destruye torres para ganar coronas; derriba la Torre del Rey para ganar al instante.</p>
    <button id="startBtn">JUGAR</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
